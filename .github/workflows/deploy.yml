name: Deploy with Password

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Generate files.json
        run: |
          python3 << 'EOF'
          import os
          import json

          ignore = ['.git', '.github', 'index.html', 'LICENSE', 'README.md', '.gitignore', 'files.json']
          files = []

          for root, dirs, filenames in os.walk('.'):
              dirs[:] = [d for d in dirs if d not in ignore and not d.startswith('.')]
              for d in dirs:
                  path = os.path.join(root, d)[2:]
                  files.append({"name": path, "type": "dir"})
              for f in filenames:
                  if f not in ignore and not f.startswith('.'):
                      path = os.path.join(root, f)[2:]
                      files.append({"name": path, "type": "file"})

          files.sort(key=lambda x: x["name"])

          with open('files.json', 'w', encoding='utf-8') as f:
              json.dump(files, f, ensure_ascii=False, indent=2)
          EOF
      
      - name: Inject password
        run: |
          # 将 index.html 中的密码占位符替换为实际密码
          sed -i "s|PASSWORD_PLACEHOLDER|${{ secrets.PAGE_PASSWORD }}|g" index.html
          
          # 验证替换是否成功
          echo "Password injection completed"
          grep "VALID_PASSWORDS" index.html || echo "Warning: Password placeholder not found"
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4